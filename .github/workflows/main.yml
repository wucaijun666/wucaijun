name: Build appex
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign
        run: |
          chmod +x widget/build_appex.sh
          ./widget/build_appex.sh "$RUNNER_TEMP/out"
          PL="$RUNNER_TEMP/out/SundiroWidget.appex/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(date -u +%Y%m%d%H%M)" "$PL"
          codesign -f -s - --entitlements widget/SundiroWidget.entitlements --generate-entitlement-der "$RUNNER_TEMP/out/SundiroWidget.appex"
          rm -rf "$RUNNER_TEMP/out/SundiroWidget.appex/_CodeSignature"
      - uses: actions/upload-artifact@v4
        with:
          name: SundiroWidget.appex
          path: $RUNNER_TEMP/out/SundiroWidget.appex
